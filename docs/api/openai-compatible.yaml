openapi: 3.1.0
info:
  title: Sakurajima OpenAI-Compatible Runtime Contract
  version: 1.0.0
  description: >
    Sakurajima 运行时依赖的外部接口规范。默认优先接入 New API，
    但保持 OpenAI-compatible 兼容方式。
servers:
  - url: "{baseUrl}"
    variables:
      baseUrl:
        default: https://your-newapi-host.example/v1
paths:
  /models:
    get:
      summary: 连接测试与模型发现
      description: 用于校验 API Key、基址规范化和服务可达性。
      security:
        - bearerAuth: []
      responses:
        "200":
          description: 成功返回模型列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModelListResponse"
        "401":
          description: 鉴权失败
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: 服务端异常
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /chat/completions:
    post:
      summary: 聊天补全
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatCompletionRequest"
      responses:
        "200":
          description: 返回完整或流式聊天结果
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatCompletionResponse"
            text/event-stream:
              schema:
                type: string
        "400":
          description: 请求无效
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: 鉴权失败
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  schemas:
    Model:
      type: object
      required: [id, object, created, owned_by]
      properties:
        id:
          type: string
        object:
          type: string
        created:
          type: integer
        owned_by:
          type: string
    ModelListResponse:
      type: object
      required: [object, data]
      properties:
        object:
          type: string
        data:
          type: array
          items:
            $ref: "#/components/schemas/Model"
    ChatMessage:
      type: object
      required: [role, content]
      properties:
        role:
          type: string
          enum: [system, user, assistant]
        content:
          type: string
    ChatCompletionRequest:
      type: object
      required: [model, messages]
      properties:
        model:
          type: string
        messages:
          type: array
          items:
            $ref: "#/components/schemas/ChatMessage"
        stream:
          type: boolean
          default: true
        temperature:
          type: number
          minimum: 0
          maximum: 2
    ChatCompletionChoice:
      type: object
      required: [index, finish_reason, message]
      properties:
        index:
          type: integer
        finish_reason:
          type: string
          nullable: true
        message:
          $ref: "#/components/schemas/ChatMessage"
    ChatCompletionResponse:
      type: object
      required: [id, object, created, model, choices]
      properties:
        id:
          type: string
        object:
          type: string
        created:
          type: integer
        model:
          type: string
        choices:
          type: array
          items:
            $ref: "#/components/schemas/ChatCompletionChoice"
    ErrorResponse:
      type: object
      properties:
        error:
          type: object
          properties:
            message:
              type: string
            type:
              type: string
            code:
              type: string

